name: Build combined MPVKit and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name'
        default: '0.41.0-av5'
  pull_request:
    branches:
      - main
      - avfoundation-ao-tvos
  push:
    branches:
      - avfoundation-ao-tvos

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="0.41.0-av5"
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test the spatial audio output
        run: ./scripts/test-spatial-audio-output.sh

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool ninja
          pipx install meson==1.4.2

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build GPL version (iOS + tvOS)
        run: make build enable-gpl platform=ios,isimulator,tvos,tvsimulator version="$RELEASE_VERSION"

      - name: Create combined MPVKit.xcframework
        run: ./Sources/BuildScripts/create-combined-framework.sh

      # Without FFmpeg's spdif muxer, mpv's passthrough decoder fails on its
      # first packet and the audio track dies, so the spatial output never opens.
      - name: Check that passthrough is built
        run: |
          for lib in dist/MPVKit-combined/xcframework/MPVKit.xcframework/*/MPVKit.framework/MPVKit; do
            # grep -c reads to the end, so nm never writes into a closed pipe
            # (grep -q would, and pipefail would then fail a good build).
            [ "$(nm "$lib" | grep -c ff_spdif_muxer || true)" -gt 0 ] || { echo "no spdif muxer in $lib"; exit 1; }
          done

      - name: Upload binary to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/MPVKit-combined/MPVKit.xcframework.zip
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Combined MPVKit.xcframework (GPL) for iOS/tvOS.

            * vo_avfoundation video output (PiP, composite OSD, VideoToolbox, HDR/DV)
            * ao_audiounit clamps hardware channel layouts it cannot map to mp
              speaker IDs, instead of building an invalid chmap and playing
              silence. Fixes HDMI routes that report 32 discrete channels with
              Atmos "Continuous Audio Output".
            * avfoundation audio output is still built but should NOT be used on
              tvOS: its clock carries no device-latency term, which stutters
              video over HDMI. audiounit is the default and the right choice.
            * mpv v0.41.0, FFmpeg n8.1
